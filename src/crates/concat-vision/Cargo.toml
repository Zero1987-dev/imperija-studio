[package]
name = "concat-vision"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "What the engine sees in a picture: the person mask behind a cutout, the brush strokes that correct it, and the frame with its background taken away."

# The renderer needs only the masks: reading them from the project's cache,
# painting strokes over them and cutting a frame with the result. Finding
# them is inference, and inference is a dependency tree the export path
# should not carry, so it sits behind `infer` and the host turns it on.
[features]
infer = ["dep:ort"]

[dependencies]
concat-core.workspace = true
concat-project.workspace = true
# Masks on disk are eight-bit grey PNGs: a tenth the size of raw bytes, and
# a file anyone can open to see what the model saw.
png = "0.17"
# ONNX Runtime. The platform's accelerator is a feature per target below;
# the CPU provider is always there behind it.
ort = { workspace = true, optional = true }

# Linux takes the runtime at *run* time rather than at link time, and this
# is not a preference. sherpa-onnx links its own copy of ONNX Runtime into
# the binary statically; those symbols then satisfy this crate's at link
# time, the shared copy the build fetched is never bound, and every session
# here runs on sherpa's - a different version, built against a different
# standard library. On Fedora 44 that one aborts inside its own device
# discovery before it has opened a model:
#
#     free(): invalid pointer
#     onnxruntime::DeviceDiscovery::DiscoverDevicesForPlatform()
#
# Loading by path at run time binds nothing at link time and cannot be
# captured. See `runtime::point_at_the_bundled_runtime`.
[target.'cfg(target_os = "linux")'.dependencies]
ort = { workspace = true, optional = true, features = ["load-dynamic"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
ort = { workspace = true, optional = true, features = ["coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { workspace = true, optional = true, features = ["directml"] }

[target.'cfg(target_os = "android")'.dependencies]
ort = { workspace = true, optional = true, features = ["nnapi"] }

[lints]
workspace = true
