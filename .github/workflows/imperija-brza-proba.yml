# Brza proba: samo Linux, samo AppImage.
#
# Puna izgradnja gradi sest platformi u cetiri formata i koristi profil s
# punim LTO-om - sedamnaest minuta samo prevodjenja, pa 519 MB za skinuti,
# sto je zajedno oko sat. Za "da li ovo dugme radi" to je predugo.
#
# Ovdje je isto, bez onoga sto proba ne treba:
#   - jedna platforma umjesto sest
#   - profil `quick` umjesto `app`: bez LTO-a, pa prevodjenje traje znatno
#     krace, a program radi dovoljno brzo da se video normalno gleda
#   - samo AppImage umjesto cetiri paketa: 123 MB umjesto 519
#
# Prave instalacije koje se dijele ljudima i dalje pravi `Proba`, odnosno
# `Release` - ovo je samo za nase testiranje.

name: Brza proba

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FFMPEG_RELEASE: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
  FFMPEG_VERSION: "8.1"
  ORT_VERSION: 1.28.0

jobs:
  linux:
    name: Linux x86_64, brzo
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -m1 '^version = ' src/crates/concat/Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgl1-mesa-dev \
            libgtk-3-dev libasound2-dev libclang-dev cmake

      - name: FFmpeg development libraries
        run: |
          set -euo pipefail
          url="$FFMPEG_RELEASE/ffmpeg-n$FFMPEG_VERSION-latest-linux64-gpl-shared-$FFMPEG_VERSION.tar.xz"
          curl -fsSL --retry 5 --retry-all-errors -o ffmpeg.tar.xz "$url"
          mkdir -p ffmpeg-dev
          tar -xf ffmpeg.tar.xz -C ffmpeg-dev --strip-components=1
          {
            echo "FFMPEG_DIR=$PWD/ffmpeg-dev"
            echo "LD_LIBRARY_PATH=$PWD/ffmpeg-dev/lib"
            echo "RUSTFLAGS=-C link-arg=-Wl,-rpath,\$ORIGIN/lib -C link-arg=-Wl,--disable-new-dtags"
          } >> "$GITHUB_ENV"

      - name: ONNX Runtime
        run: |
          set -euo pipefail
          stem="onnxruntime-linux-x64-$ORT_VERSION"
          curl -fsSL --retry 5 --retry-all-errors -o onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$stem.tgz"
          tar -xzf onnxruntime.tgz
          ln -sf "libonnxruntime.so.$ORT_VERSION" "$stem/lib/libonnxruntime.so"
          {
            echo "ORT_LIB_LOCATION=$PWD/$stem/lib"
            echo "ORT_PREFER_DYNAMIC_LINK=1"
            echo "ORT_DIR=$PWD/$stem"
          } >> "$GITHUB_ENV"

      - name: sherpa-onnx static libraries
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -A1 'name = "sherpa-onnx-sys"' src/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          stem="sherpa-onnx-v$version-linux-x64-static-lib"
          curl -fsSL --retry 5 --retry-all-errors -o sherpa.tar.bz2 \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$version/$stem.tar.bz2"
          mkdir -p sherpa
          tar -xjf sherpa.tar.bz2 -C sherpa
          echo "SHERPA_ONNX_LIB_DIR=$PWD/sherpa/$stem/lib" >> "$GITHUB_ENV"

      # A key of its own: the `quick` profile's artefacts are not the `app`
      # profile's, and one cache holding both would evict half of itself on
      # every run.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: quick-linux

      - name: Build
        shell: bash
        working-directory: src
        run: cargo build --profile quick -p concat --target x86_64-unknown-linux-gnu

      - name: AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="Imperija-Studio-${VERSION}-linux-x86_64"
          appdir="$PWD/Imperija.AppDir"
          mkdir -p "$appdir/usr/bin/lib" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/usr/share/applications"
          cp src/target/x86_64-unknown-linux-gnu/quick/concat "$appdir/usr/bin/concat"
          cp -a ffmpeg-dev/lib/*.so* "$appdir/usr/bin/lib/"
          cp -a "$ORT_DIR"/lib/libonnxruntime.so* "$appdir/usr/bin/lib/"
          cp assets/icons/concat_logo_256.png "$appdir/concat.png"
          cp assets/icons/concat_logo_256.png "$appdir/usr/share/icons/hicolor/256x256/apps/concat.png"
          cat > "$appdir/concat.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Imperija Studio
          Comment=Editor videa za TikTok
          Exec=concat
          Icon=concat
          Categories=AudioVideo;Video;
          Terminal=false
          DESKTOP
          cp "$appdir/concat.desktop" "$appdir/usr/share/applications/concat.desktop"
          ln -s concat.png "$appdir/.DirIcon"
          ln -s usr/bin/concat "$appdir/AppRun"
          # Every library has to resolve from the folder alone, or the
          # AppImage runs here and nowhere else.
          report=$(env -u LD_LIBRARY_PATH ldd "$appdir/usr/bin/concat" || true)
          if grep -i 'not found' <<<"$report"; then
            echo "$report"
            exit 1
          fi
          curl -fsSL --retry 5 --retry-all-errors -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p stage
          ./appimagetool --appimage-extract-and-run "$appdir" "stage/$name.AppImage"
          chmod +x "stage/$name.AppImage"
          ls -lh stage

      - uses: actions/upload-artifact@v7
        with:
          name: brza-proba-linux
          path: stage/*.AppImage
          if-no-files-found: error
